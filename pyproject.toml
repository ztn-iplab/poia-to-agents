[project]
name = "poia-to-agents"
version = "0.1.0"
description = "Proof-of-Intent Authorization (PoIA) for LLM agents, evaluated on AgentDojo"
authors = [{ name = "Patrick Mutabazi" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pinned on purpose: every result we report must be reproducible on exactly this benchmark code.
    "agentdojo==0.1.35",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poia_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
